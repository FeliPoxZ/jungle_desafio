# =============================================================================
# Ambiente local completo: PostgreSQL, Keycloak, LocalStack (SQS), migrations e
# a aplicação. Todos os dados são descartáveis.
#
#   docker compose up -d postgres keycloak localstack   # infra
#   docker compose run --rm localstack-init             # cria as filas
#   docker compose up -d --build                        # infra + migrations + api
#
# Notas de rede:
#   - Dentro da rede do compose, os serviços se alcançam pelo nome do serviço
#     (postgres, keycloak, localstack).
#   - Do host (sua máquina), os mesmos serviços estão em localhost nas portas
#     5432/8080/4566.
#   - Por isso a aplicação recebe DOIS endereços para o Keycloak:
#     OIDC_DISCOVERY_URL (rede interna, para buscar as chaves públicas) e
#     OIDC_ISSUER (o endereço que aparece no claim "iss" do token, que é o
#     que o cliente usa). Sem essa separação, o token emitido para
#     http://localhost:8080 nunca validaria dentro do container.
# =============================================================================

name: jungleg

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL: banco da aplicação e também do Keycloak (bancos separados).
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: jungleg-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jungleg}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jungleg}
      POSTGRES_DB: ${POSTGRES_DB:-jungleg}
      # Deixa o log útil para depurar concorrência e deadlock.
      POSTGRES_INITDB_ARGS: "--data-checksums"
    command:
      - postgres
      - -c
      - log_min_duration_statement=500ms
      - -c
      - log_lock_waits=on
      - -c
      - deadlock_timeout=1s
      - -c
      - max_connections=200
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Scripts executados apenas quando o volume de dados está vazio.
      - ./deploy/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jungleg} -d ${POSTGRES_DB:-jungleg}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # ---------------------------------------------------------------------------
  # Keycloak: IdP OAuth2/OIDC. O realm é importado automaticamente do arquivo
  # deploy/keycloak/realm.json (clients, roles, mappers e usuários de teste).
  # ---------------------------------------------------------------------------
  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    container_name: jungleg-keycloak
    command: ["start-dev", "--import-realm", "--health-enabled=true"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      # Hostname público: garante que o claim "iss" dos tokens seja sempre
      # http://localhost:8080/realms/jungleg, alcançável tanto pelo host quanto
      # pela app (que usa localhost:8080 via host.docker.internal).
      KC_HOSTNAME: http://localhost:8080
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_LOG_LEVEL: INFO
    ports:
      - "8080:8080"
    volumes:
      - ./deploy/keycloak:/opt/keycloak/data/import:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # O endpoint de health sobe na porta de gerenciamento (9000).
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q 'UP' <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s

  # ---------------------------------------------------------------------------
  # LocalStack: SQS local. As filas são criadas pelo serviço localstack-init.
  #
  # ⚠️ VERSÃO FIXADA DE PROPÓSITO (4.0.3). NÃO use "stable" nem "latest":
  # a partir de 2026 a LocalStack encerrou a edição community e as tags novas
  # exigem licença Pro (variável LOCALSTACK_AUTH_TOKEN). Sem o token o
  # container morre no boot com:
  #   "License activation failed! No credentials were found in the environment"
  # A 4.0.3 é a última imagem community estável e cobre o que usamos de SQS
  # (filas FIFO, DLQ, redrive, visibility timeout, long polling).
  # Alternativa aceita pelo enunciado e documentada no README: MiniStack.
  # ---------------------------------------------------------------------------
  localstack:
    image: localstack/localstack:4.0.3
    container_name: jungleg-localstack
    environment:
      SERVICES: sqs
      DEBUG: "0"
      PERSISTENCE: "1"
      AWS_DEFAULT_REGION: ${SQS_REGION:-us-east-1}
    ports:
      - "4566:4566"
    volumes:
      - localstack-data:/var/lib/localstack
      - ./deploy/localstack:/etc/localstack/init/ready.d:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:4566/_localstack/health | grep -q '\"sqs\"'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

  # ---------------------------------------------------------------------------
  # Job de criação/verificação das filas FIFO e das DLQs.
  # É idempotente: pode ser executado quantas vezes quiser.
  # ---------------------------------------------------------------------------
  localstack-init:
    image: amazon/aws-cli:latest
    container_name: jungleg-localstack-init
    profiles: ["init", "tools"]
    entrypoint: ["/bin/sh", "/scripts/init-queues.sh"]
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
      AWS_DEFAULT_REGION: ${SQS_REGION:-us-east-1}
      AWS_ENDPOINT_URL: http://localstack:4566
      SQS_MAX_RECEIVE_COUNT: ${SQS_MAX_RECEIVE_COUNT:-5}
    volumes:
      - ./deploy/localstack:/scripts:ro
    depends_on:
      localstack:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Migrations versionadas. Roda até concluir com sucesso ou falhar de vez;
  # a API só sobe depois (depends_on: service_completed_successfully).
  # ---------------------------------------------------------------------------
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        TARGET: migrate
    image: jungleg-migrate:local
    container_name: jungleg-migrate
    command: ["up"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-jungleg}:${POSTGRES_PASSWORD:-jungleg}@postgres:5432/${POSTGRES_DB:-jungleg}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # ---------------------------------------------------------------------------
  # Aplicação: API HTTP + consumidor SQS + publisher da outbox.
  # ---------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        TARGET: api
    image: jungleg-api:local
    container_name: jungleg-api
    environment:
      APP_ENV: local
      LOG_LEVEL: ${LOG_LEVEL:-info}
      HTTP_ADDR: ":8080"
      # O prazo total do shutdown precisa cobrir os TRÊS encerramentos que rodam
      # dentro dele, em sequência: o do servidor HTTP (drena as requisições em
      # andamento), o do consumidor de SQS (conclui o lote ou libera a
      # visibilidade) e o dos laços da Fase 9 (publicador, referências e reaper).
      # A config recusa a soma que não couber: 20 + 15 + 10 = 45s, com 50s de
      # margem. `stop_grace_period` acompanha — sem ele o `docker stop` manda
      # SIGKILL em 10s e o encerramento gracioso nunca aconteceria no compose.
      HTTP_STOP_TIMEOUT: "50s"
      HTTP_SHUTDOWN_TIMEOUT: "20s"
      WORKERS_SHUTDOWN_GRACE: "10s"
      DATABASE_URL: postgres://${POSTGRES_USER:-jungleg}:${POSTGRES_PASSWORD:-jungleg}@postgres:5432/${POSTGRES_DB:-jungleg}?sslmode=disable
      DB_MAX_CONNS: "20"
      # O `iss` do token é o endereço PÚBLICO (o que o cliente alcança), enquanto
      # o serviço busca o discovery pelo hostname interno — com um endereço só,
      # ou o `iss` não bate (todo token vira 401) ou o serviço não alcança o IdP.
      OIDC_ISSUER: http://localhost:8080/realms/jungleg
      OIDC_DISCOVERY_URL: http://host.docker.internal:8080/realms/jungleg
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-jungleg-api}
      OIDC_JWKS_CACHE_TTL: "15m"
      OIDC_CLOCK_SKEW: "30s"
      OIDC_HTTP_TIMEOUT: "5s"
      # Não usado pela aplicação (o serviço nunca emite token): serve às
      # ferramentas e aos testes que obtêm token por client_credentials.
      OIDC_TOKEN_URL: http://localhost:8080/realms/jungleg/protocol/openid-connect/token
      SQS_ENDPOINT: http://localstack:4566
      SQS_REGION: ${SQS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
      SQS_TRANSACTIONS_QUEUE: wager-transactions.fifo
      SQS_TRANSACTIONS_DLQ: wager-transactions-dlq.fifo
      # O retry do consumidor é o `ChangeMessageVisibility` com backoff exponencial:
      # a mensagem não é removida nem descartada, volta depois do prazo.
      SQS_BASE_BACKOFF: "2s"
      SQS_MAX_BACKOFF: "1m"
      # Teto do `maxReceiveCount` da fila (deploy/localstack/init-queues.sh): é a
      # rede de segurança para a falha transitória que insistiu até o limite.
      SQS_MAX_RECEIVE_COUNT: "5"
      SQS_CONSUMER_CONCURRENCY: "8"
      SQS_VISIBILITY_TIMEOUT: "30s"
      SQS_WAIT_TIME: "20s"
      SQS_BATCH_SIZE: "10"
      SQS_CONSUME_TRANSACTIONS: "true"
      # Prazo para concluir o lote em andamento antes de liberar a visibilidade
      # do que sobrou (reentrega segura). Cabe dentro do STOP_TIMEOUT acima.
      SQS_SHUTDOWN_GRACE: "15s"
      OUTBOX_ENABLED: "true"
      REFERENCE_ENABLED: "true"
    # O encerramento gracioso dos workers depende de o Docker ESPERAR o processo
    # terminar: o padrão do `docker stop` manda SIGTERM e SIGKILL em 10s, o que
    # abortaria o prazo de 50s da aplicação no meio. Com 60s o processo tem tempo
    # de concluir (ou devolver pelo lease) o trabalho em voo.
    stop_grace_period: 60s
    ports:
      - "8081:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/app/api", "-health-check"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  postgres-data:
  localstack-data:
