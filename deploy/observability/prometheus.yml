# Coleta do Jungle Desafio (Prometheus).
#
# Este arquivo NÃO é um serviço do `docker-compose.yml` — a decisão está
# justificada em `README.md` ("Por que não há Prometheus no compose"). Ele é a
# configuração pronta para apontar um Prometheus existente para a API.
#
# Os alvos estão na rede do compose (`jungleg_default`), onde o serviço se chama
# `api` e escuta em 8080. Quem rodar o Prometheus no HOST troca por
# `localhost:8081` (a porta publicada) — os dois alvos.

global:
  # 15s é o padrão do Prometheus e mais fino que o intervalo em que o atraso da
  # outbox é recalculado (15s); mais frequente que isso só gera ruído.
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alertas.yml

scrape_configs:
  # As métricas de negócio: /metrics é público na API (README §12).
  - job_name: jungleg
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8080"]

  # O readiness é JSON, não métrica. O blackbox_exporter transforma o
  # `/health/ready` em `probe_success` — é o que permite alertar "workers DOWN"
  # sem inventar uma métrica nova (a Fase 11 não cria métrica).
  - job_name: jungleg-ready
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ["http://api:8080/health/ready"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
